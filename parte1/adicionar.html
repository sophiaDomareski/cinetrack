<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
</head>
<body>
    <a href="index.html">Voltar</a>
    <h1>Adicionar filme</h1>

    <form id="form-filme">
        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type = "text" required>

        <label for="ano">Ano</label>
        <input id="ano" name="ano" 
                type = "number" min="1888" max="2030">

        <label for="genero">Gênero</label>
        <input id="genero" name="genero" type = "text" required>

        <label for="url">URL do pôster</label>
        <input id="url" name="url" type = "text">

        <label >Status
            <select required ="status" id="status">
                <option value="querAssistir">Quero assistir</option>
                <option value="assistindo">Assistido</option>
                <option value="assistido">Assistido</option>
            </select></label>

        <label >Nota<input type="number" min="1" max="5"></label>
        
        <label>Comentário>
            <textarea name="Comentario" id="Comentario" rows="3">
                Minha opinião sobre esse filme...
        </textarea></label>

        <button type="submit">Salvar</button>
        <button type="button">Cancelar</button>
    </form>
</body>
</html>
