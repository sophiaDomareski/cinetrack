<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Titulo da página -->
    <header>
        <h1>CineTrack</h1>
        <input type="search" placeholder="Buscar filme" aria-label="Buscar filme">
        <a href="adicionar.html">
        <button>
            <span class = "icone-adicionar">+</span>
            <span class = "texto-adicionar">+Adicionar</span>
        </button>
        </a>
    </header>
    
    <nav aria-label="Filtro de status">
        <button class ="ativo" data-status="todos">Todos</button>
        <button data-status="assistido">Assistido</button>
        <button data-status="assistindo">Assistindo</button>
        <button data-status="quero">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">
        </section>

    </main>

    <footer>
        <small id="rodape"></small>
    </footer>    
    <script src="app.js"></script>
</body>
</html>
